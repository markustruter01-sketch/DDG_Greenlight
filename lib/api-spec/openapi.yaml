openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /greenlight/config:
    get:
      operationId: getGreenlightConfig
      responses:
        "200":
          description: Capabilities and catalogue library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GreenlightConfig" }
  /greenlight/projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Saved projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
  /greenlight/assess:
    post:
      operationId: createAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentInput" }
      responses:
        "201":
          description: Completed rule-based assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentRun" }
  /greenlight/upload:
    post:
      operationId: uploadAssessment
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Assessed zip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentRun" }
  /greenlight/runs/{id}:
    get:
      operationId: getAssessment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Run and its evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentRun" }
    patch:
      operationId: updateAssessment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentUpdate" }
      responses:
        "200":
          description: New run after rule-based rescore
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentRun" }
  /greenlight/projects/{id}/compare:
    get:
      operationId: compareProject
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Run history with item-level comparisons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
  /greenlight/runs/{id}/reports:
    get:
      operationId: listReports
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Generated reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
  /greenlight/runs/{id}/reports/{kind}:
    get:
      operationId: downloadReport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Report file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /greenlight/runs/{id}/fixes:
    get:
      operationId: listFixRuns
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Fix timeline
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FixRun" }
    post:
      operationId: startFix
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FixInput" }
      responses:
        "202":
          description: Fix run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixRun" }
  /greenlight/fixes/{id}/approve:
    post:
      operationId: approveFix
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FixApproval" }
      responses:
        "200":
          description: Approved fix result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixRun" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Standard:
      type: object
      required: [id, name, short, lens, items]
      properties:
        id: { type: string }
        name: { type: string }
        short: { type: string }
        lens: { type: string }
        items: { type: integer }
        levels: { type: array, items: { type: string } }
        defaultLevel: { type: string }
        note: { type: string }
        furtherTesting: { type: string }
    Question:
      type: object
      required: [id, question, theme, kind]
      properties:
        id: { type: string }
        question: { type: string }
        theme: { type: string }
        kind: { type: string }
        options: { type: array, items: { type: string } }
    GreenlightConfig:
      type: object
      required: [standards, questions, fixingEnabled, githubEnabled, checks]
      properties:
        standards: { type: array, items: { $ref: "#/components/schemas/Standard" } }
        questions: { type: array, items: { $ref: "#/components/schemas/Question" } }
        fixingEnabled: { type: boolean }
        githubEnabled: { type: boolean }
        checks: { type: string }
        engineVersion: { type: string }
        fixingDisabledReason: { type: string }
        rules:
          type: object
          description: Every written check, by id, in Greenlight's own words
          additionalProperties:
            type: object
            required: [title, theme, fix]
            properties:
              title: { type: string }
              theme: { type: string }
              fix: { type: string }
        ruleCount: { type: integer }
        factCount: { type: integer }
        itemCount: { type: integer }
    Project:
      type: object
      required: [id, name, source, updatedAt, runCount, latestRunId, readiness, verdict]
      properties:
        id: { type: string }
        name: { type: string }
        source: { type: string }
        updatedAt: { type: string }
        runCount: { type: integer }
        latestRunId: { type: string }
        readiness: { type: number }
        verdict: { type: string }
    AssessmentInput:
      type: object
      required: [github, standards]
      properties:
        github: { type: string }
        projectId: { type: string }
        standards: { type: array, minItems: 1, items: { type: string } }
        levels: { type: object, additionalProperties: { type: string } }
        facts: { type: object, additionalProperties: { type: string } }
        classification: { type: string }
        maturity: { type: integer, minimum: 1, maximum: 3 }
    AssessmentUpdate:
      type: object
      properties:
        facts: { type: object, additionalProperties: { type: string } }
        classification: { type: string }
        classificationAccepted: { type: boolean }
        levels: { type: object, additionalProperties: { type: string } }
        maturity: { type: integer, minimum: 1, maximum: 3 }
    Evidence:
      type: object
      required: [file, note]
      properties:
        file: { type: string }
        line: { type: integer }
        note: { type: string }
        ruleId: { type: string }
    Finding:
      type: object
      required: [key, id, title, standardId, standardShort, theme, lens, status, statusText, blocking, why, evidence, closedBy, proofOfFix]
      properties:
        key: { type: string }
        id: { type: string }
        title: { type: string }
        standardId: { type: string }
        standardShort: { type: string }
        theme: { type: string }
        lens: { type: string }
        group: { type: string }
        status: { type: string }
        statusText: { type: string }
        severity: { type: string }
        blocking: { type: boolean }
        why: { type: string }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
        closedBy: { type: array, items: { type: string } }
        proofOfFix: { type: string }
        factIds: { type: array, items: { type: string } }
    StandardResult:
      type: object
      required: [id, name, short, lens, readiness, total, compliant, partial, failed, unanswered, blocking, verdict, furtherTesting]
      properties:
        id: { type: string }
        name: { type: string }
        short: { type: string }
        lens: { type: string }
        readiness: { type: number }
        total: { type: integer }
        compliant: { type: integer }
        partial: { type: integer }
        failed: { type: integer }
        unanswered: { type: integer }
        blocking: { type: integer }
        verdict: { type: string }
        furtherTesting: { type: string }
    Wave:
      type: object
      required: [number, title, fixCount, readiness, statuses, fixes]
      properties:
        number: { type: integer }
        title: { type: string }
        fixCount: { type: integer }
        readiness: { type: object, additionalProperties: { type: number } }
        statuses: { type: object, additionalProperties: { type: string } }
        fixes: { type: array, items: { $ref: "#/components/schemas/PlanFix" } }
    PlanFix:
      type: object
      required: [key, title, kind, theme, acceptance, itemKeys]
      properties:
        key: { type: string }
        title: { type: string }
        kind: { type: string }
        theme: { type: string }
        acceptance: { type: string }
        itemKeys: { type: array, items: { type: string } }
    Classification:
      type: object
      required: [suggested, impactLevel, reason, evidence, accepted, current, attribution]
      properties:
        suggested: { type: string }
        impactLevel: { type: integer }
        reason: { type: string }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
        accepted: { type: boolean }
        current: { type: string }
        attribution: { type: string }
    AssessmentRun:
      type: object
      required: [id, projectId, projectName, source, assessedAt, verdict, readiness, counts, standards, findings, waves, classification, facts, levels, maturity, inventory, isDemo]
      properties:
        id: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        source: { type: string }
        assessedAt: { type: string }
        verdict: { type: string }
        readiness: { type: number }
        counts: { type: object, additionalProperties: { type: integer } }
        standards: { type: array, items: { $ref: "#/components/schemas/StandardResult" } }
        findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        waves: { type: array, items: { $ref: "#/components/schemas/Wave" } }
        classification: { $ref: "#/components/schemas/Classification" }
        facts: { type: object, additionalProperties: { type: string } }
        levels: { type: object, additionalProperties: { type: string } }
        maturity: { type: integer }
        inventory: { type: object, additionalProperties: true }
        isDemo: { type: boolean }
    Report:
      type: object
      required: [kind, title, standardId, formats, url, generatedAt]
      properties:
        kind: { type: string }
        title: { type: string }
        standardId: { type: string }
        formats: { type: array, items: { type: string } }
        url: { type: string }
        generatedAt: { type: string }
    Comparison:
      type: object
      required: [runs, items]
      properties:
        runs: { type: array, items: { $ref: "#/components/schemas/AssessmentRun" } }
        items: { type: array, items: { $ref: "#/components/schemas/ComparisonItem" } }
    ComparisonItem:
      type: object
      required: [key, title, baseline, projected, actual]
      properties:
        key: { type: string }
        title: { type: string }
        baseline: { type: string }
        projected: { type: string }
        actual: { type: string }
    FixInput:
      type: object
      required: [wave]
      properties:
        wave: { type: integer, minimum: 1, maximum: 4 }
    FixApproval:
      type: object
      required: [approvedFiles, output]
      properties:
        approvedFiles: { type: array, items: { type: string } }
        output: { type: string, enum: [zip, pr] }
    FixRun:
      type: object
      required: [id, runId, wave, status, timeline, changes]
      properties:
        id: { type: string }
        runId: { type: string }
        wave: { type: integer }
        status: { type: string }
        timeline: { type: array, items: { type: string } }
        changes: { type: array, items: { $ref: "#/components/schemas/FileChange" } }
        events:
          type: array
          description: Console events recorded during the run (see FixEvent); present once the run has finished
          items: { $ref: "#/components/schemas/FixEvent" }
        verificationRunId: { type: string }
        downloadUrl: { type: string }
        pullRequestUrl: { type: string }
        error: { type: string }
    FixEvent:
      type: object
      description: One thing that happened during a fix run; `at` is milliseconds since the run started
      required: [at, type]
      additionalProperties: true
      properties:
        at: { type: integer }
        type: { type: string, enum: [plan, stage, note, package, tool, edit, test, cost, done] }
    FileChange:
      type: object
      required: [file, before, after, approved]
      properties:
        file: { type: string }
        before: { type: string }
        after: { type: string }
        approved: { type: boolean }
