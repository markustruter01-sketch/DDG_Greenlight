name: Refresh lockfile (one-off)

# Temporary: applies the new overrides to pnpm-lock.yaml and pushes it back.
# (zod: catalog moved to 4.x; 3.x has no patched release.) Removed in the next commit once the lockfile is updated.
on:
  push:
    branches: [ci/name-audit-advisories]
    paths: [.github/workflows/refresh-lock.yml, pnpm-workspace.yaml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the overrides to the lockfile only
        run: |
          set -o pipefail
          report() { tail -n 25 "$1" | sed 's/^/::error::/'; exit 1; }
          pnpm install --lockfile-only 2>&1 | tee lock.log || report lock.log
          grep -nE "^  (body-parser|zod)@" pnpm-lock.yaml | sed 's/^/::notice::/'
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee install.log || report install.log
          pnpm audit --prod --audit-level=high 2>&1 | tee audit.log || report audit.log
      - name: Push the lockfile
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Lockfile: body-parser and zod to patched releases"
          git push
