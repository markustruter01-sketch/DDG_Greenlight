name: Refresh lockfile (one-off)

# Temporary: records the API server's new zod dependency in pnpm-lock.yaml and
# pushes it back. Removed in the next commit once the lockfile is updated.
on:
  push:
    branches: [fix/zod4-api-start]
    paths: [.github/workflows/refresh-lock.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update the lockfile only
        run: |
          set -o pipefail
          pnpm install --lockfile-only 2>&1 | tee lock.log || { tail -n 25 lock.log | sed 's/^/::error::/'; exit 1; }
      - name: Push the lockfile
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Lockfile: the API server depends on zod directly"
          git push
