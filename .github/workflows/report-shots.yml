name: Report shots (one-off)
on:
  push:
    branches: [tooling/report-shots]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Capture
        continue-on-error: true
        run: |
          mkdir -p out
          npm install --no-save --no-package-lock playwright@1.56.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null 2>&1 || true
          node scripts/report-shots.mjs "$GITHUB_WORKSPACE/out" > out/run.log 2>&1 || echo "exit $?" >> out/run.log
      - name: Push
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b report-shots-out
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm shots
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" report-shots-out
