name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck every package
        run: pnpm run typecheck

      - name: Engine unit tests
        run: pnpm --filter @workspace/greenlight-engine test

      - name: Catalogue freshness
        run: pnpm --filter @workspace/greenlight-engine run check:catalogues

      - name: Build web app and API
        env:
          PORT: '5173'
          BASE_PATH: '/'
          NODE_ENV: production
        run: pnpm --filter @workspace/greenlight --filter @workspace/api-server run build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
