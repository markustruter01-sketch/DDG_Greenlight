name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck every package
        run: pnpm run typecheck 2>&1 | tee typecheck.log; test ${PIPESTATUS[0]} -eq 0

      # The job log is not readable from the authoring session, so failures are
      # also published as a check run whose text the REST API returns.
      - name: Publish typecheck errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "error TS|Error|error" typecheck.log | head -c 60000 > errors.txt || true
          gh api -X POST "repos/${{ github.repository }}/check-runs" \
            -f name="typecheck-errors" -f head_sha="${{ github.sha }}" -f status=completed -f conclusion=failure \
            -f "output[title]=Typecheck errors" -F "output[summary]=@errors.txt" >/dev/null

      - name: Engine unit tests
        run: pnpm --filter @workspace/greenlight-engine test

      - name: Catalogue freshness
        run: pnpm --filter @workspace/greenlight-engine run check:catalogues

      - name: Build web app and API
        env:
          PORT: '5173'
          BASE_PATH: '/'
          NODE_ENV: production
        run: pnpm --filter @workspace/greenlight --filter @workspace/api-server run build 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: API server starts
        # Typecheck and build cannot catch a module that fails as it loads; start the built server and ask it for its config.
        env:
          PORT: '5199'
          NODE_ENV: production
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/none
        run: |
          cd artifacts/api-server
          node --enable-source-maps ./dist/index.mjs > start.log 2>&1 &
          pid=$!
          for i in $(seq 1 20); do
            sleep 1
            if ! kill -0 $pid 2>/dev/null; then echo "::error title=API server exited on start::$(tail -n 15 start.log | tr '\n' ' ')"; exit 1; fi
            if grep -q "Server listening" start.log; then echo "API server is listening"; kill $pid; exit 0; fi
          done
          echo "::error title=API server did not start::$(tail -n 15 start.log | tr '\n' ' ')"; kill $pid; exit 1

      - name: Publish build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -iE "error|failed" build.log | head -c 60000 > berrors.txt || true
          gh api -X POST "repos/${{ github.repository }}/check-runs" \
            -f name="build-errors" -f head_sha="${{ github.sha }}" -f status=completed -f conclusion=failure \
            -f "output[title]=Build errors" -F "output[summary]=@berrors.txt" >/dev/null

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Name the failing advisories
        if: failure()
        run: |
          pnpm audit --prod --json > audit.json || true
          node -e '
            const d = require("./audit.json");
            for (const a of Object.values(d.advisories || {})) {
              if (!["high", "critical"].includes(a.severity)) continue;
              const paths = [...new Set((a.findings || []).flatMap((f) => f.paths || []))].slice(0, 3).join(" ; ");
              console.log(`::error title=${a.severity} ${a.module_name}::${a.module_name} ${a.vulnerable_versions} patched=${a.patched_versions} ${a.github_advisory_id || ""} ${a.title} via ${paths}`);
            }'
